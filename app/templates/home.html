{% extends 'base.html' %}
{% block start%}

<!-- Navigation Bar -->
{% include 'navbar.html' %}

<div class=" mainbox">
    <div class="bgimg image" id="image"></div>
    <div class="container fade_in">
        <h2>Scrape smarter, rise faster </h2>
        <h2>than competitors.</h2>
        <p>Data at your fingertips, scrape efficiently, and outspace your competition.</p>
        <a href="#scraper_box"><button class="box_btn" type="button">Learn More</button></a>
    </div>
</div>
{% if user.is_authenticated %}
<div class="scrapBox" style="display: flex; justify-content: center;">
    <div class="mainContainer" id="scraper_box">
        <h1>Scraper</h1>

        <form method="post" action="/">
            {% csrf_token %}
            <label for="
            -to-scrape">Item to Scrape:</label>
            <input type="text" id="item-to-scrape" name="item-to-scrape" required>

            <label for="data-amount">Number of Items to Scrape:</label>
            <input type="number" id="data-amount" name="data-amount" required>

            <label for="website-selector">Select Website:</label>
            <select id="website-selector" name="website-selector" required>
                <option value="">Select Platform</option>
                <option value="Amazon">Amazon</option>
                <option value="Myntra">Myntra</option>
            </select>

            <label for="your-file-name">Your File Name </label>
            <input type="text" id="your-file-name" name="your-file-name" required>

            <input type="submit" value="Start Scraping">
        </form>


    </div>
</div>
<div class="slideImg"></div>
<!-- create box for comments  -->

{% else %}

{% endif %}


<script>
    function fetchRealTimeData() {
        fetch("{% url 'result' %}")
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    console.error('Error:', data.error);
                    return;
                }
                document.querySelector('.table-wrapper').innerHTML = data.table_html;
            })
            .catch(error => console.error('Error:', error));
    }

    // Fetch real-time data every 30 seconds
    setInterval(fetchRealTimeData, 30000);

    // Initial fetch when page loads
    fetchRealTimeData();
</script>

<script>
    // Show the loading indicator when scraping starts
    document.querySelector('form').addEventListener('submit', function () {
        document.getElementById('loading-indicator').classList.add('show');
    });


</script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script>
    // Register ScrollTrigger plugin
    gsap.registerPlugin(ScrollTrigger);


    // GSAP animation to scale up the image on scroll
    gsap.to(".slideImg", {
        transform: translateX(-10), // Scale image up to 1.5 times its size
        scrollTrigger: {
            trigger: ".slideImg", // The element that triggers the animation
            start: "top 70%",      // When the top of the container reaches 80% of the viewport height
            end: "top 10%",        // When the top of the container reaches 20% of the viewport height
            scrub: true,           // Smooth animation linked to the scroll position
            markers: true          // For debugging, you can remove this later
        }
    });
</script>

{% endblock %}
